name: CI

# Analysis and tests on every push. Cheap, and the only thing standing between
# a typo and a broken release.
#
# The site is not deployed here. Vercel builds it itself from the repository —
# see vercel.json and scripts/vercel-build.sh — which keeps the deployment
# working without an API token living in this repository's secrets. The
# downloadable binaries are cut from tags in release.yml.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Fijada a propósito: con solo `channel: stable` una versión nueva
          # de Flutter puede romper la compilación sin que nadie toque nada.
          # Es la misma que usa scripts/vercel-build.sh.
          flutter-version: 3.47.1
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test

  mobile-goldens:
    # Las referencias se capturaron en Windows. El rasterizado del motor en
    # Linux difiere unos píxeles aun con el mismo código y la misma fuente.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true
      - run: flutter pub get
      - run: flutter test test/movil_test.dart
